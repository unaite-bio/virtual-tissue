[project]
name = "virtual-tissue"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy", "pyyaml", "anndata>=0.8", "h5py"]

[project.optional-dependencies]
data = ["spatialdata>=0.9,<0.10", "scipy", "pandas", "pillow", "tifffile", "huggingface_hub"]

[project.scripts]
usbb = "usbb.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usbb"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [".pixi"]

# Environments: `pixi install` builds the default one (core and dev tools); each group of methods
# with its own dependencies gets a feature and an environment below, all in one pixi.lock.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "osx-arm64",
  "win-64",
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
]

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
pyyaml = "*"
anndata = "*"
h5py = "*"
scipy = "*"
pandas = "*"
pillow = "*"
tifffile = "*"
huggingface_hub = "*"

[tool.pixi.pypi-dependencies]
virtual-tissue = { path = ".", editable = true }
spatialdata = "==0.9.*"  # not on conda-forge yet

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."

# The torch group: pretrained image encoders, on GPU nodes only. Self-contained (conda packages
# only): method steps run usbb from the checkout through PYTHONPATH=src, so it is not installed.
[tool.pixi.feature.torch]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.torch.dependencies]
python = "3.12.*"
numpy = "*"
pyyaml = "*"
anndata = "*"
h5py = "*"
pandas = "*"
pillow = "*"
pytest = "*"
huggingface_hub = "*"
pytorch-gpu = "*"  # forces the CUDA build of pytorch
torchvision = "*"
timm = ">=1.0"
transformers = ">=5"
safetensors = "*"

[tool.pixi.environments]
default = ["dev"]
torch = { features = ["torch"], no-default-feature = true }

[tool.pytest.ini_options]
testpaths = ["tests", "src/usbb/methods"]
markers = ["gpu: needs a GPU", "slow: long-running"]
addopts = "-m 'not gpu and not slow'"
