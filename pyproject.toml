[project]
name = "virtual-tissue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [] # add as we go

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Cell 1 rebuilds the main notebook's state with run_cell, so ruff can't see these names
"notebooks/Christian_EDA/Causer_registration_comparison.ipynb" = ["F821", "PLW1510", "SIM115"]

[tool.pytest.ini_options]
markers = ["gpu: needs a GPU", "slow: long-running"]
addopts = "-m 'not gpu and not slow'"
