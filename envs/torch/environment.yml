# GPU nodes only. Lock on the HPC, then build the environment from the lock:
#   conda-lock -f envs/torch/environment.yml --virtual-package-spec envs/virtual-packages.yml \
#     -p linux-64 --lockfile envs/torch/conda-lock.yml
#   micromamba create -p <env path> -f envs/torch/conda-lock.yml
# usbb itself comes from the checkout (PYTHONPATH=src), so it is not installed here.
name: usbb-torch
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pytorch-gpu
  - torchvision
  - timm>=1.0
  - transformers>=5  # load(dtype=...) needs transformers 5
  - safetensors
  - huggingface_hub
  - pillow
  - numpy
  - pyyaml
  - anndata
  - h5py
  - pandas
  - pytest
