# One pixi environment per group of methods that can share dependencies, all defined in
# pyproject.toml ([tool.pixi.*]) and locked together in pixi.lock.
# A card's env_group is the only membership list. Each group says why it cannot join another.
# The launcher hashes the lock into the run key; the command that runs inside a group's
# environment is machine-specific and lives in the untracked usbb.local.toml ([groups]),
# for example torch = ["pixi", "run", "--manifest-path", "<repo>/pyproject.toml", "-e", "torch"].

core:
  reason: The usbb core (Python 3.12, SpatialData 0.9) runs the launcher, data preparation and the reference methods, which need only numpy.
  lock: pixi.lock

torch:
  reason: Pretrained encoders need PyTorch with CUDA, timm and transformers, too heavy for the core environment and for CI.
  lock: pixi.lock
